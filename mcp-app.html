<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>共读 · PDF 阅读器</title>
  </head>
  <body>
    <div class="main">
      <div id="library-bar" class="library-bar" hidden>
        <button id="library-home" type="button">书库</button>
        <button id="library-add-current" type="button" hidden>加入书库</button>
        <span id="library-save-status" role="status" aria-live="polite"></span>
        <span id="library-migration-status" role="status"></span>
        <button id="library-retry-save" type="button" hidden>重试保存</button>
      </div>
      <section id="library-panel" class="library-panel" aria-label="我的书库" hidden></section>
      <section id="text-reader" class="text-reader" aria-label="Markdown 与代码阅读器" hidden></section>
      <!-- Loading State -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p id="loading-text">正在打开 PDF…</p>
      </div>

      <!-- Error State -->
      <div id="error" class="error" style="display: none">
        <div class="error-icon">⚠️</div>
        <p id="error-message">An error occurred</p>
      </div>

      <!-- Confirmation Dialog Overlay -->
      <div id="confirm-dialog" class="confirm-dialog" style="display: none">
        <div class="confirm-box">
          <div id="confirm-title" class="confirm-title"></div>
          <div id="confirm-body" class="confirm-body"></div>
          <div id="confirm-detail" class="confirm-detail"></div>
          <div id="confirm-buttons" class="confirm-buttons"></div>
        </div>
      </div>

      <!-- PDF Viewer -->
      <div id="viewer" class="viewer" style="display: none">
        <!-- Toolbar -->
        <div class="toolbar">
          <div class="toolbar-left">
            <button id="outline-toggle" class="reader-action" aria-label="展开或收起阅读导航" aria-controls="reader-navigation">导航</button>
            <span id="pdf-title" class="pdf-title">Document</span>
            <div id="loading-indicator" class="loading-indicator" style="display: none"
                 title="正在加载页面…">
              <svg aria-hidden="true" focusable="false" viewBox="0 0 20 20" width="14" height="14">
                <circle class="loading-indicator-bg" cx="10" cy="10" r="8"/>
                <circle class="loading-indicator-arc" cx="10" cy="10" r="8"/>
              </svg>
            </div>
          </div>
          <div class="toolbar-center">
            <button id="prev-btn" class="nav-btn" title="上一页（←）" aria-label="上一页">
              ◀
            </button>
            <div class="page-nav">
              <input
                id="page-input"
                type="number"
                class="page-input"
                min="1"
                value="1"
                title="输入页码，按回车跳转" aria-label="页码" aria-describedby="total-pages"
              />
              <span id="total-pages" class="total-pages">共 1 页</span>
            </div>
            <button id="next-btn" class="nav-btn" title="下一页（→）" aria-label="下一页">
              ▶
            </button>
          </div>
          <div class="toolbar-right">
            <button
              id="save-btn"
              class="save-btn"
              title="保存到原文件（覆盖原文件）" aria-label="保存 PDF 到原文件"
              style="display: none"
            >
              <svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 14H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h7l3 3v9a1 1 0 0 1-1 1z"/><path d="M11 14V9H5v5"/><path d="M5 2v3h5"/></svg>
            </button>
            <button
              id="download-btn"
              class="download-btn"
              title="下载 PDF" aria-label="下载 PDF"
              style="display: none"
            >
              <svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8m0 0l-3-3m3 3l3-3"/><path d="M2 12v2h12v-2"/></svg>
            </button>
            <button
              id="annotations-btn"
              class="annotations-btn"
              title="展开或收起批注面板" aria-label="展开或收起批注面板" aria-controls="annotation-panel"
              style="display: none"
            >
              <svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="14" height="14" rx="2"/><line x1="5" y1="5" x2="11" y2="5"/><line x1="5" y1="8" x2="11" y2="8"/><line x1="5" y1="11" x2="9" y2="11"/></svg>
              <span id="annotations-badge" class="annotations-badge" style="display: none"></span>
            </button>
            <button
              id="search-btn"
              class="search-btn"
              title="搜索 PDF（Ctrl/Cmd+F）" aria-label="搜索 PDF" aria-controls="search-bar"
            ></button>
            <button
              id="fullscreen-btn"
              class="fullscreen-btn"
              title="展开阅读器（Ctrl/Cmd+Enter）"
              aria-label="展开阅读器"
            >
              <svg aria-hidden="true" focusable="false" class="expand-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              <svg aria-hidden="true" focusable="false" class="collapse-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
              <span class="display-mode-label">展开阅读器</span>
            </button>
          </div>
        </div>
        <div class="zoom-bar" role="group" aria-label="PDF 页面显示" title="在 PDF 上按住 Ctrl 并滚动鼠标滚轮：向上放大，向下缩小">
          <span class="zoom-caption">缩放</span>
          <button id="zoom-out-btn" class="zoom-btn" title="缩小（−）" aria-label="缩小">−</button>
          <input id="zoom-level" class="zoom-level" type="text" inputmode="decimal" value="100%"
                 aria-label="缩放百分比" title="输入 50–300，按回车应用，也可输入百分号" />
          <button id="zoom-in-btn" class="zoom-btn" title="放大（＋）" aria-label="放大">+</button>
          <button id="zoom-width-btn" class="reader-action" title="让页面填满可用宽度">适合宽度</button>
          <button id="zoom-page-btn" class="reader-action" title="显示完整一页">整页</button>
          <button id="rotate-page-btn" class="reader-action" title="本页顺时针旋转 90°，仅改变阅读方向，不修改 PDF" aria-label="本页顺时针旋转 90 度">旋转</button>
        </div>
        <div class="selection-bar">
          <span id="selection-status" role="status" aria-live="polite">选中原文，向小吉提问</span>
          <button id="highlight-selection-btn" class="reader-action" title="把当前选区标成 PDF 高亮；可撤销，下载后写入文件" disabled>高亮选区</button>
          <button id="explain-selection-btn" class="reader-action reader-primary" disabled>解释选中内容</button>
        </div>
        <!-- Search stays in flow so it cannot cover page or OCR controls. -->
        <div id="search-bar" class="search-bar" style="display: none">
          <input
            id="search-input"
            class="search-input"
            type="text"
            placeholder="搜索文字或已识别页"
            aria-label="搜索 PDF 文字层和已识别页"
            autocomplete="off"
          />
          <span id="search-match-count" class="search-match-count"></span>
          <button
            id="search-prev-btn"
            class="search-nav-btn"
            title="上一个搜索结果（Shift+Enter）" aria-label="上一个搜索结果"
          >
            &#x25B2;
          </button>
          <button
            id="search-next-btn"
            class="search-nav-btn"
            title="下一个搜索结果（Enter）" aria-label="下一个搜索结果"
          >
            &#x25BC;
          </button>
          <button
            id="search-close-btn"
            class="search-nav-btn"
            title="关闭搜索（Esc）" aria-label="关闭搜索"
          >
            &#x2715;
          </button>
        </div>

        <!-- Canvas + Annotation Panel Row -->
        <div class="viewer-body reader-workspace">
          <aside id="reader-navigation" aria-label="文档导航"></aside>
          <!-- Single Page Canvas Container -->
          <div class="canvas-container">
            <div class="page-wrapper">
              <canvas id="pdf-canvas"></canvas>
              <div id="annotation-layer" class="annotation-layer"></div>
              <div id="highlight-layer" class="highlight-layer"></div>
              <div id="text-layer" class="text-layer"></div>
              <div id="form-layer" class="annotationLayer"></div>
            </div>
          </div>

          <!-- Annotation Side Panel -->
          <div id="annotation-panel" class="annotation-panel" style="display: none">
            <div id="annotation-panel-resize" class="annotation-panel-resize"></div>
            <div class="annotation-panel-header">
              <span class="annotation-panel-title">批注（<span id="annotation-panel-count">0</span>）</span>
              <div class="annotation-panel-header-actions">
                <button id="annotation-panel-reset" class="annotation-panel-reset" title="撤销未保存的批注更改，恢复 PDF 文件中的批注" aria-label="恢复 PDF 文件中的批注"><svg aria-hidden="true" focusable="false" width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6a4 4 0 1 1 1.2 2.85"/><path d="M2 9V6h3"/></svg></button>
                <button id="annotation-panel-clear-all" class="annotation-panel-clear-all" title="移除所有批注，包括 PDF 原文件中的批注" aria-label="清空所有批注"><svg aria-hidden="true" focusable="false" width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 3h8M4.5 3V2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 .5.5v1M5 5.5v3M7 5.5v3M3 3l.5 7a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1L9 3"/></svg></button>
                <button id="annotation-panel-close" class="annotation-panel-close" title="关闭批注面板" aria-label="关闭批注面板">&#x2715;</button>
              </div>
            </div>
            <div id="annotation-panel-list" class="annotation-panel-list"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/mcp-app.ts"></script>
  </body>
</html>
